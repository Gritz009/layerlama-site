# Netlify configuration — security headers and caching
# Created 2026-04-21. See 11-TROUBLESHOOTING.md for CSP-related debugging notes.

[build]
  publish = "."
  functions = "netlify/functions"

# ---------------------------------------------------------------------------
# Global security headers — applied to every response.
# CSP uses 'unsafe-inline' for script-src and style-src because the site's
# scripts and styles are inline (Option C). All other directives are strict.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=(), accelerometer=(), gyroscope=(), magnetometer=()"
    Cross-Origin-Resource-Policy = "cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://res.cloudinary.com https://*.makerworld.com https://makerworld.com https://www.google.com; connect-src 'self' https://api.cloudinary.com https://res.cloudinary.com; media-src 'self' https://res.cloudinary.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

# ---------------------------------------------------------------------------
# Static asset caching — images, fonts, icons: long cache with immutable hint.
# HTML is left with default behaviour (must-revalidate) so edits go live fast.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/Images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ---------------------------------------------------------------------------
# Service worker must never be cached aggressively — otherwise updates stick.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------------------------------------------------------------------------
# Admin interface — extra lockdown. No indexing, no caching of HTML.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
